<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stopwatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <div class="card mx-auto" style="width: 18rem;">
        <!--display start-->
        <h3 class="display text-center border mx-auto my-3 p-3 rounded shadow text-success">00:00:00</h3>
        <!--display end-->
        <!--buttons-->
        <div class="d-flex justify-content-center mb-2">
            <button class="btn btn-success start-btn">start</button>
            <button class="btn btn-warning mx-2 stop-btn">stop</button>
            <button class="btn btn-danger reset-btn">reset</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="stopwatch.js"></script>
  </body>
</html>
